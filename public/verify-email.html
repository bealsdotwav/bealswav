<!-- verify-email.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e7eaee" />
  <title>Verify Email | Beals.wav</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4926KVF6L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T4926KVF6L');
  </script>

  <!-- Font (match modern pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0b1b2b;
      --blue:#1787ab;
      --blue2:#3eb7db;
      --bgTopA:#f7f9fb;
      --bgTopB:#eef3f8;
      --panel: rgba(255,255,255,0.78);
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 22px 60px rgba(15, 23, 42, 0.14);
      --tickerH: 34px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      overflow-x:hidden;
      background:
        radial-gradient(1000px 650px at 18% 8%, rgba(62,183,219,0.14), transparent 60%),
        radial-gradient(900px 600px at 85% 22%, rgba(23,135,171,0.10), transparent 62%),
        linear-gradient(180deg, var(--bgTopA), var(--bgTopB));
      padding: 24px 16px calc(var(--tickerH) + 24px);
      display:grid;
      place-items:center;
    }

    .card{
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .top{
      padding: 18px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(62,183,219,0.22), transparent 60%),
        radial-gradient(900px 420px at 80% 100%, rgba(23,135,171,0.18), transparent 62%),
        rgba(247,249,251,0.88);
      border-bottom: 1px solid rgba(15,23,42,0.10);
    }

    h1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.35rem;
      color: rgba(11,27,43,0.92);
      text-transform: capitalize;
    }
    p{
      margin: 8px 0 0;
      color: rgba(11,27,43,0.62);
      font-weight: 850;
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .body{ padding: 18px; display:grid; gap: 10px; }

    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      font-weight: 950;
      box-shadow: 0 18px 46px rgba(23,135,171,0.20);
      user-select:none;
      transition: transform 140ms ease, filter 140ms ease;
      text-transform: capitalize;
      font-size: 1.02rem;
      width: min(360px, 100%);
      cursor:pointer;
    }
    .cta:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .cta:active{ transform: translateY(1px); }

    .ticker{
      position:fixed; bottom:0; width:100%;
      height: var(--tickerH);
      background:#000; overflow:hidden;
      border-top:1px solid rgba(255,255,255,0.10);
      z-index:998;
    }
    .tickerTrack{ display:flex; width:max-content; will-change: transform; transform: translateX(0); }
    .tickerItem{
      display:flex; align-items:center;
      padding: 0 22px;
      height: var(--tickerH);
      font-size:0.92rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color:#00ffff;
      white-space:nowrap;
      text-shadow: 0 0 10px rgba(0,255,255,0.18);
      animation: tickerColor 9s ease-in-out infinite alternate;
    }
    @keyframes tickerColor{
      0%{color:#00ffff}
      25%{color:#ff5c7a}
      50%{color:#a0ff00}
      75%{color:#ff00ff}
      100%{color:#00ffff}
    }
  </style>
</head>

<body>
  <div class="card" aria-label="Email verified">
    <div class="top">
      <h1>Email verified</h1>
      <p>Your account is active. Login and get back to making noise.</p>
    </div>
    <div class="body">
      <a class="cta" href="/login.html">Go to login</a>
      <a class="cta" href="/index.html" style="background: rgba(255,255,255,0.72); color: rgba(11,27,43,0.86); border: 1px solid rgba(15,23,42,0.12); box-shadow: none;">
        Home
      </a>
    </div>
  </div>

  <div class="ticker" aria-label="Site ticker">
    <div class="tickerTrack" id="tickerTrack">
      <div class="tickerItem" id="tickerItem">
        Beals.wav • Verified • Login • Account • West Jordan, Utah • © 2025 Beals.wav •
      </div>
    </div>
  </div>

  <script>
    // Ticker loop
    (function () {
      const track = document.getElementById('tickerTrack');
      const item  = document.getElementById('tickerItem');
      if (!track || !item) return;

      const clone = item.cloneNode(true);
      track.appendChild(clone);

      let x = 0;
      const speed = 0.7;

      function step(){
        x -= speed;
        const w = item.offsetWidth;
        if (-x >= w) x = 0;
        track.style.transform = `translateX(${x}px)`;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
