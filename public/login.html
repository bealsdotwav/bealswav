<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e7eaee" />
  <title>Login | Beals.wav</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4926KVF6L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T4926KVF6L');
  </script>

  <!-- Font (match modern pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink: #0b1b2b;

      --blue: #1787ab;
      --blue2:#3eb7db;

      --bgTopA: #f7f9fb;
      --bgTopB: #eef3f8;

      --panel: rgba(255,255,255,0.78);
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 22px 60px rgba(15, 23, 42, 0.14);

      --max: 1120px;
      --tickerH: 34px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      overflow-x:hidden;
      background:
        radial-gradient(1000px 650px at 18% 8%, rgba(62,183,219,0.14), transparent 60%),
        radial-gradient(900px 600px at 85% 22%, rgba(23,135,171,0.10), transparent 62%),
        linear-gradient(180deg, var(--bgTopA), var(--bgTopB));
      padding-bottom: calc(var(--tickerH) + 24px);
    }

    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 16px;
    }

    /* HEADER */
    header{
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(247,249,251,0.76);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      backdrop-filter: blur(14px);
    }

    .topbar{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 10px;
      padding: 12px 0;
    }

    .navGroup{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap:wrap;
    }
    .navLeft{ justify-content:flex-start; }
    .navRight{ justify-content:flex-end; }

    .navBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      font-weight: 900;
      letter-spacing: -0.01em;
      font-size: 0.92rem;
      color: rgba(11,27,43,0.78);
      transition: transform 120ms ease, filter 120ms ease;
      user-select:none;
      white-space:nowrap;
      text-transform: capitalize;
      cursor:pointer;
    }
    .navBtn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .navBtn:active{ transform: translateY(1px); }

    .navBtnPrimary{
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 16px 40px rgba(23,135,171,0.22);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 2px 0;
    }
    .brand img{
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,0.12));
    }

    .hamburger{
      display:none;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      cursor:pointer;
      font-weight: 950;
      color: rgba(11,27,43,0.82);
    }

    .drawer{
      display:none;
      border-top: 1px solid rgba(15,23,42,0.08);
      background: rgba(247,249,251,0.88);
      backdrop-filter: blur(14px);
      padding: 10px 0 14px;
    }
    .drawerInner{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* LOGIN CARD */
    .section{ padding: 26px 0 42px; }
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      place-items:center;
      padding: 18px 0 6px;
    }

    .card{
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cardTop{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
      padding: 16px 18px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(62,183,219,0.22), transparent 60%),
        radial-gradient(900px 420px at 80% 100%, rgba(23,135,171,0.18), transparent 62%),
        rgba(247,249,251,0.88);
      border-bottom: 1px solid rgba(15,23,42,0.10);
    }
    .cardTop h1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.2rem;
      color: rgba(11,27,43,0.92);
      text-transform: capitalize;
    }
    .cardTop p{
      margin:0;
      color: rgba(11,27,43,0.58);
      font-weight: 850;
      font-size: 0.95rem;
    }

    .cardBody{ padding: 18px; }

    .field{ display:flex; flex-direction:column; gap: 6px; margin-bottom: 10px; }
    .field label{
      font-weight: 900;
      font-size: 0.85rem;
      color: rgba(11,27,43,0.70);
      text-transform: capitalize;
    }
    .input{
      width:100%;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(15,23,42,0.14);
      background: rgba(255,255,255,0.70);
      font-weight: 850;
      color: rgba(11,27,43,0.82);
      outline: none;
    }
    .input:focus{
      border-color: rgba(23,135,171,0.45);
      box-shadow: 0 0 0 4px rgba(62,183,219,0.18);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin-top: 10px;
    }

    .check{
      display:flex;
      align-items:center;
      gap: 8px;
      font-weight: 850;
      color: rgba(11,27,43,0.70);
      font-size: 0.95rem;
      user-select:none;
    }
    .check input{ width: 18px; height: 18px; }

    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      font-weight: 950;
      box-shadow: 0 18px 46px rgba(23,135,171,0.20);
      user-select:none;
      transition: transform 140ms ease, filter 140ms ease;
      text-transform: capitalize;
      font-size: 1.02rem;
      width: 100%;
      cursor:pointer;
    }
    .cta:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .cta:active{ transform: translateY(1px); }

    .smallActions{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .miniCta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      font-weight: 950;
      box-shadow: 0 16px 38px rgba(23,135,171,0.16);
      user-select:none;
      transition: transform 140ms ease, filter 140ms ease;
      text-transform: capitalize;
      font-size: 0.98rem;
      width: 100%;
      cursor:pointer;
    }
    .miniCta:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .miniCta:active{ transform: translateY(1px); }

    .msg{
      margin-top: 12px;
      border-radius: 18px;
      padding: 12px 12px;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(15,23,42,0.12);
      font-weight: 900;
      color: rgba(11,27,43,0.76);
      display:none;
    }
    .msg.err{
      border-color: rgba(255,92,122,0.35);
      color: rgba(120,0,20,0.78);
    }
    .msg.ok{
      border-color: rgba(62,183,219,0.35);
      color: rgba(0,80,120,0.78);
    }

    /* Ticker */
    .ticker{
      position:fixed;
      bottom:0;
      width:100%;
      height: var(--tickerH);
      background:#000;
      overflow:hidden;
      border-top:1px solid rgba(255,255,255,0.10);
      z-index:998;
    }
    .tickerTrack{
      display:flex;
      width:max-content;
      will-change: transform;
      transform: translateX(0);
    }
    .tickerItem{
      display:flex;
      align-items:center;
      gap: 18px;
      padding: 0 22px;
      height: var(--tickerH);
      font-size:0.92rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color:#00ffff;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(0,255,255,0.18);
      animation: tickerColor 9s ease-in-out infinite alternate;
    }
    @keyframes tickerColor{
      0%{color:#00ffff}
      25%{color:#ff5c7a}
      50%{color:#a0ff00}
      75%{color:#ff00ff}
      100%{color:#00ffff}
    }

    @media (max-width: 760px){
      .navGroup{ display:none; }
      .hamburger{ display:inline-flex; align-items:center; justify-content:center; }
      .topbar{ grid-template-columns: auto 1fr auto; }
      .brand{ justify-content:center; }
      .drawerInner{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="navGroup navLeft" aria-label="Top navigation left">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html">Beats</a>
        </div>

        <div class="brand">
          <a href="/index.html" aria-label="Home">
            <img src="/assets/images/logo.jpeg?v=9" alt="beals.wav">
          </a>
        </div>

        <div class="navGroup navRight" aria-label="Top navigation right">
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn navBtnPrimary" href="/login.html" aria-current="page">Login</a>
        </div>

        <button class="hamburger" id="menuBtn" aria-label="Menu" type="button">☰</button>
      </div>

      <div class="drawer" id="drawer">
        <div class="drawerInner">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html">Beats</a>
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn navBtnPrimary" href="/login.html" aria-current="page">Login</a>
        </div>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <div class="grid">
        <div class="card" aria-label="Login card">
          <div class="cardTop">
            <div>
              <h1 id="formTitle">Login</h1>
              <p id="formSub">Access your account</p>
            </div>
            <a class="navBtn" href="/index.html" aria-label="Close">Close</a>
          </div>

          <div class="cardBody">
            <!-- LOGIN -->
            <form id="loginForm" autocomplete="on">
              <div class="field">
                <label for="li-email">Email</label>
                <input class="input" type="email" id="li-email" required autocomplete="email" />
              </div>
              <div class="field">
                <label for="li-password">Password</label>
                <input class="input" type="password" id="li-password" required autocomplete="current-password" />
              </div>

              <div class="row">
                <label class="check">
                  <input type="checkbox" id="li-show" />
                  Show password
                </label>
                <label class="check">
                  <input type="checkbox" id="li-remember" />
                  Remember email
                </label>
              </div>

              <div class="row" style="margin-top:12px;">
                <button class="cta" type="submit">Login</button>
              </div>
            </form>

            <!-- ONLY these controls remain (the "blue ones below") -->
            <div class="smallActions" aria-label="Account actions">
              <button class="miniCta" type="button" id="openRegister">Create account</button>
              <button class="miniCta" type="button" id="openReset">Forgot password</button>
            </div>

            <!-- REGISTER -->
            <form id="registerForm" style="display:none; margin-top:12px;" autocomplete="on">
              <div class="field">
                <label for="re-name">Name</label>
                <input class="input" type="text" id="re-name" required autocomplete="name" />
              </div>
              <div class="field">
                <label for="re-email">Email</label>
                <input class="input" type="email" id="re-email" required autocomplete="email" />
              </div>
              <div class="field">
                <label for="re-password">Password</label>
                <input class="input" type="password" id="re-password" required autocomplete="new-password" />
              </div>
              <div class="field">
                <label for="re-confirm">Confirm password</label>
                <input class="input" type="password" id="re-confirm" required autocomplete="new-password" />
              </div>

              <div class="row" style="margin-top:12px;">
                <button class="cta" type="submit">Create account</button>
              </div>

              <div class="row" style="margin-top:10px;">
                <button class="miniCta" type="button" id="backToLogin1">Back to login</button>
              </div>
            </form>

            <!-- RESET -->
            <form id="resetForm" style="display:none; margin-top:12px;" autocomplete="on">
              <div class="field">
                <label for="rs-email">Email</label>
                <input class="input" type="email" id="rs-email" required autocomplete="email" />
              </div>

              <div class="row" style="margin-top:12px;">
                <button class="cta" type="submit">Send reset link</button>
              </div>

              <div class="row" style="margin-top:10px;">
                <button class="miniCta" type="button" id="backToLogin2">Back to login</button>
              </div>
            </form>

            <div id="msg" class="msg" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="ticker" aria-label="Site ticker">
    <div class="tickerTrack" id="tickerTrack">
      <div class="tickerItem" id="tickerItem">
        Beals.wav • Login • Account • Sessions • Beats • Studio • West Jordan, Utah • © 2025 Beals.wav •
      </div>
    </div>
  </div>

  <script>
    // Drawer toggle
    (function () {
      const btn = document.getElementById('menuBtn');
      const drawer = document.getElementById('drawer');
      if (!btn || !drawer) return;

      btn.addEventListener('click', () => {
        const open = drawer.style.display === 'block';
        drawer.style.display = open ? 'none' : 'block';
      });

      document.addEventListener('click', (e) => {
        if (!drawer.contains(e.target) && e.target !== btn) drawer.style.display = 'none';
      });
    })();

    // Helpers
    (function(){
      const msg = document.getElementById('msg');
      function setMsg(text, type){
        if (!text) { msg.style.display='none'; msg.textContent=''; msg.className='msg'; return; }
        msg.style.display='block';
        msg.textContent=text;
        msg.className = 'msg ' + (type || '');
      }

      const loginForm = document.getElementById('loginForm');
      const regForm   = document.getElementById('registerForm');
      const resetForm = document.getElementById('resetForm');

      const openRegister = document.getElementById('openRegister');
      const openReset    = document.getElementById('openReset');
      const back1 = document.getElementById('backToLogin1');
      const back2 = document.getElementById('backToLogin2');

      function show(which){
        setMsg('');
        loginForm.style.display = (which==='login') ? 'block' : 'none';
        regForm.style.display   = (which==='register') ? 'block' : 'none';
        resetForm.style.display = (which==='reset') ? 'block' : 'none';

        // keep the two blue buttons visible only on login view
        document.querySelector('.smallActions').style.display = (which==='login') ? 'flex' : 'none';
      }

      openRegister.addEventListener('click', () => show('register'));
      openReset.addEventListener('click', () => show('reset'));
      back1.addEventListener('click', () => show('login'));
      back2.addEventListener('click', () => show('login'));

      // Show password
      document.getElementById('li-show').addEventListener('change', (e) => {
        document.getElementById('li-password').type = e.target.checked ? 'text' : 'password';
      });

      // Remember email only
      const remembered = localStorage.getItem('rememberedEmail') || '';
      if (remembered) {
        document.getElementById('li-email').value = remembered;
        document.getElementById('li-remember').checked = true;
      }

      // expose
      window.__auth = { setMsg, show };
    })();

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('li-email').value.trim();
      const password = document.getElementById('li-password').value;
      const remember = document.getElementById('li-remember').checked;

      window.__auth.setMsg('', '');

      try{
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success){
          sessionStorage.setItem('userEmail', email);
          localStorage.setItem('loggedIn', 'true');
          if (remember) localStorage.setItem('rememberedEmail', email);
          else localStorage.removeItem('rememberedEmail');

          window.location.href = '/account.html';
          return;
        }

        window.__auth.setMsg(data.message || 'Invalid credentials.', 'err');
      }catch{
        window.__auth.setMsg('Server error. Try again.', 'err');
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('re-name').value.trim();
      const email = document.getElementById('re-email').value.trim();
      const pw = document.getElementById('re-password').value;
      const cpw = document.getElementById('re-confirm').value;

      window.__auth.setMsg('', '');

      if (pw !== cpw){
        window.__auth.setMsg('Passwords do not match.', 'err');
        return;
      }

      try{
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password: pw })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success){
          window.__auth.setMsg('Account created. Please log in.', 'ok');
          document.getElementById('li-email').value = email;
          window.__auth.show('login');
          return;
        }

        window.__auth.setMsg(data.message || 'Registration failed.', 'err');
      }catch{
        window.__auth.setMsg('Server error. Try again.', 'err');
      }
    });

    // Reset
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('rs-email').value.trim();
      window.__auth.setMsg('', '');

      try{
        const res = await fetch('/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (res.ok){
          window.__auth.setMsg('If that email exists, a reset link has been sent.', 'ok');
          window.__auth.show('login');
          return;
        }

        window.__auth.setMsg('Error sending reset link.', 'err');
      }catch{
        window.__auth.setMsg('Server error. Try again.', 'err');
      }
    });

    // Ticker loop
    (function () {
      const track = document.getElementById('tickerTrack');
      const item  = document.getElementById('tickerItem');
      if (!track || !item) return;

      const clone = item.cloneNode(true);
      track.appendChild(clone);

      let x = 0;
      const speed = 0.7;

      function step(){
        x -= speed;
        const w = item.offsetWidth;
        if (-x >= w) x = 0;
        track.style.transform = `translateX(${x}px)`;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
