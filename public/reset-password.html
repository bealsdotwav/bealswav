<!-- reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e7eaee" />
  <title>Reset Password | Beals.wav</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4926KVF6L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T4926KVF6L');
  </script>

  <!-- Font (match modern pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0b1b2b;
      --blue:#1787ab;
      --blue2:#3eb7db;
      --bgTopA:#f7f9fb;
      --bgTopB:#eef3f8;
      --panel: rgba(255,255,255,0.78);
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 22px 60px rgba(15, 23, 42, 0.14);
      --max: 1120px;
      --tickerH: 34px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      overflow-x:hidden;
      background:
        radial-gradient(1000px 650px at 18% 8%, rgba(62,183,219,0.14), transparent 60%),
        radial-gradient(900px 600px at 85% 22%, rgba(23,135,171,0.10), transparent 62%),
        linear-gradient(180deg, var(--bgTopA), var(--bgTopB));
      padding-bottom: calc(var(--tickerH) + 24px);
    }
    a{ color:inherit; text-decoration:none; }

    .wrap{ max-width: var(--max); margin:0 auto; padding: 0 16px; }

    header{
      position: sticky; top:0; z-index:50;
      background: rgba(247,249,251,0.76);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      backdrop-filter: blur(14px);
    }
    .topbar{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 10px;
      padding: 12px 0;
    }
    .navGroup{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .navLeft{ justify-content:flex-start; }
    .navRight{ justify-content:flex-end; }

    .navBtn{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      font-weight: 900;
      letter-spacing: -0.01em;
      font-size: 0.92rem;
      color: rgba(11,27,43,0.78);
      transition: transform 120ms ease, filter 120ms ease;
      user-select:none; white-space:nowrap;
      text-transform: capitalize;
    }
    .navBtn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .navBtn:active{ transform: translateY(1px); }

    .brand{ display:flex; align-items:center; justify-content:center; padding: 2px 0; }
    .brand img{ height:38px; width:auto; object-fit:contain; filter: drop-shadow(0 10px 18px rgba(15,23,42,0.12)); }

    .hamburger{
      display:none;
      width:44px; height:44px;
      border-radius:999px;
      border:1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      cursor:pointer;
      font-weight:950;
      color: rgba(11,27,43,0.82);
    }
    .drawer{
      display:none;
      border-top: 1px solid rgba(15,23,42,0.08);
      background: rgba(247,249,251,0.88);
      backdrop-filter: blur(14px);
      padding: 10px 0 14px;
    }
    .drawerInner{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .section{ padding: 26px 0 42px; }
    .grid{ display:grid; place-items:center; padding: 18px 0 6px; }

    .card{
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cardTop{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
      padding: 16px 18px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(62,183,219,0.22), transparent 60%),
        radial-gradient(900px 420px at 80% 100%, rgba(23,135,171,0.18), transparent 62%),
        rgba(247,249,251,0.88);
      border-bottom: 1px solid rgba(15,23,42,0.10);
    }
    .cardTop h1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.2rem;
      color: rgba(11,27,43,0.92);
      text-transform: capitalize;
    }
    .cardTop p{
      margin:0;
      color: rgba(11,27,43,0.58);
      font-weight: 850;
      font-size: 0.95rem;
    }
    .cardBody{ padding: 18px; }

    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
    .field label{
      font-weight:900;
      font-size:0.85rem;
      color: rgba(11,27,43,0.70);
      text-transform: capitalize;
    }
    .input{
      width:100%;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(15,23,42,0.14);
      background: rgba(255,255,255,0.70);
      font-weight:850;
      color: rgba(11,27,43,0.82);
      outline:none;
    }
    .input:focus{
      border-color: rgba(23,135,171,0.45);
      box-shadow: 0 0 0 4px rgba(62,183,219,0.18);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin-top: 10px;
    }

    .check{
      display:flex;
      align-items:center;
      gap: 8px;
      font-weight: 850;
      color: rgba(11,27,43,0.70);
      font-size: 0.95rem;
      user-select:none;
    }
    .check input{ width:18px; height:18px; }

    .cta{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      font-weight: 950;
      box-shadow: 0 18px 46px rgba(23,135,171,0.20);
      width: 100%;
      cursor:pointer;
      transition: transform 140ms ease, filter 140ms ease;
      text-transform: capitalize;
      font-size: 1.02rem;
      user-select:none;
    }
    .cta:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .cta:active{ transform: translateY(1px); }

    .msg{
      margin-top: 12px;
      border-radius: 18px;
      padding: 12px 12px;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(15,23,42,0.12);
      font-weight: 900;
      color: rgba(11,27,43,0.76);
      display:none;
    }
    .msg.err{ border-color: rgba(255,92,122,0.35); color: rgba(120,0,20,0.78); }
    .msg.ok { border-color: rgba(62,183,219,0.35); color: rgba(0,80,120,0.78); }

    .ticker{
      position:fixed; bottom:0; width:100%;
      height: var(--tickerH);
      background:#000; overflow:hidden;
      border-top:1px solid rgba(255,255,255,0.10);
      z-index:998;
    }
    .tickerTrack{ display:flex; width:max-content; will-change: transform; transform: translateX(0); }
    .tickerItem{
      display:flex; align-items:center;
      padding: 0 22px;
      height: var(--tickerH);
      font-size:0.92rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color:#00ffff;
      white-space:nowrap;
      text-shadow: 0 0 10px rgba(0,255,255,0.18);
      animation: tickerColor 9s ease-in-out infinite alternate;
    }
    @keyframes tickerColor{
      0%{color:#00ffff}
      25%{color:#ff5c7a}
      50%{color:#a0ff00}
      75%{color:#ff00ff}
      100%{color:#00ffff}
    }

    @media (max-width: 760px){
      .navGroup{ display:none; }
      .hamburger{ display:inline-flex; align-items:center; justify-content:center; }
      .topbar{ grid-template-columns: auto 1fr auto; }
      .drawerInner{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="navGroup navLeft" aria-label="Top navigation left">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html">Beats</a>
        </div>

        <div class="brand">
          <a href="/index.html" aria-label="Home">
            <img src="/assets/images/logo.jpeg?v=9" alt="beals.wav">
          </a>
        </div>

        <div class="navGroup navRight" aria-label="Top navigation right">
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn" href="/login.html">Login</a>
        </div>

        <button class="hamburger" id="menuBtn" aria-label="Menu" type="button">☰</button>
      </div>

      <div class="drawer" id="drawer">
        <div class="drawerInner">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html">Beats</a>
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn" href="/login.html">Login</a>
        </div>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <div class="grid">
        <div class="card" aria-label="Reset password card">
          <div class="cardTop">
            <div>
              <h1>Set new password</h1>
              <p>Use your reset link token</p>
            </div>
            <a class="navBtn" href="/login.html" aria-label="Close">Back</a>
          </div>

          <div class="cardBody">
            <form id="resetForm" autocomplete="on">
              <input type="hidden" id="token" value="">

              <div class="field" id="emailRow" style="display:none;">
                <label for="emailDisplay">Email</label>
                <input class="input" type="email" id="emailDisplay" readonly>
              </div>

              <div class="field">
                <label for="newPassword">New password</label>
                <input class="input" type="password" id="newPassword" required autocomplete="new-password">
              </div>

              <div class="row">
                <label class="check">
                  <input type="checkbox" id="togglePassword">
                  Show password
                </label>
              </div>

              <div class="row" style="margin-top:12px;">
                <button class="cta" type="submit">Set new password</button>
              </div>
            </form>

            <div id="msg" class="msg" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="ticker" aria-label="Site ticker">
    <div class="tickerTrack" id="tickerTrack">
      <div class="tickerItem" id="tickerItem">
        Beals.wav • Reset Password • Login • Account • West Jordan, Utah • © 2026 Beals.wav •
      </div>
    </div>
  </div>

  <script>
    // Drawer toggle
    (function () {
      const btn = document.getElementById('menuBtn');
      const drawer = document.getElementById('drawer');
      if (!btn || !drawer) return;

      btn.addEventListener('click', () => {
        const open = drawer.style.display === 'block';
        drawer.style.display = open ? 'none' : 'block';
      });

      document.addEventListener('click', (e) => {
        if (!drawer.contains(e.target) && e.target !== btn) drawer.style.display = 'none';
      });
    })();

    function setMsg(text, type){
      const el = document.getElementById('msg');
      if (!text) { el.style.display='none'; el.textContent=''; el.className='msg'; return; }
      el.style.display='block';
      el.textContent = text;
      el.className = 'msg ' + (type || '');
    }

    // Pull token/email from URL
    (function(){
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      document.getElementById('token').value = token;

      const email = params.get('email');
      if (email){
        document.getElementById('emailRow').style.display = 'block';
        document.getElementById('emailDisplay').value = email;
      }
    })();

    // Show password
    document.getElementById('togglePassword').addEventListener('change', function(){
      document.getElementById('newPassword').type = this.checked ? 'text' : 'password';
    });

    // Submit reset
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('', '');

      const token = document.getElementById('token').value;
      const newPassword = document.getElementById('newPassword').value;

      if (!token){
        setMsg('Missing token. Use the link from your reset email.', 'err');
        return;
      }

      try{
        const res = await fetch('/reset-password', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok){
          setMsg(data.message || 'Password updated. Redirecting to login…', 'ok');
          setTimeout(() => (location.href = '/login.html'), 1800);
          return;
        }
        setMsg(data.message || 'Reset failed.', 'err');
      }catch{
        setMsg('Server error. Try again.', 'err');
      }
    });

    // Ticker loop
    (function () {
      const track = document.getElementById('tickerTrack');
      const item  = document.getElementById('tickerItem');
      if (!track || !item) return;

      const clone = item.cloneNode(true);
      track.appendChild(clone);

      let x = 0;
      const speed = 0.7;

      function step(){
        x -= speed;
        const w = item.offsetWidth;
        if (-x >= w) x = 0;
        track.style.transform = `translateX(${x}px)`;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
