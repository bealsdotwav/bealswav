<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e7eaee" />
  <title>Beats | Beals.wav</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4926KVF6L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T4926KVF6L');
  </script>

  <!-- Font (match modern pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Performance: preconnect BeatStars -->
  <link rel="preconnect" href="https://player.beatstars.com" crossorigin>
  <link rel="dns-prefetch" href="//player.beatstars.com">

  <style>
    :root{
      --ink: #0b1b2b;

      --blue: #1787ab;
      --blue2:#3eb7db;

      --bgTopA: #f7f9fb;

      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 22px 60px rgba(15, 23, 42, 0.14);

      --max: 1120px;

      --tickerH: 34px;
      --headerH: 64px; /* JS will set exact */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      background: var(--bgTopA);
      overflow:hidden; /* true fullscreen embed */
    }

    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; }

    /* ─────────────────────────────────────────────────────────────
       HEADER (match index/faq/contact)
    ───────────────────────────────────────────────────────────── */
    header{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: rgba(247,249,251,0.76);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      backdrop-filter: blur(14px);
    }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 16px;
    }

    .topbar{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 10px;
      padding: 12px 0;
    }

    .navGroup{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap:wrap;
    }
    .navLeft{ justify-content:flex-start; }
    .navRight{ justify-content:flex-end; }

    .navBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      font-weight: 900;
      letter-spacing: -0.01em;
      font-size: 0.92rem;
      color: rgba(11,27,43,0.78);
      transition: transform 120ms ease, filter 120ms ease;
      user-select:none;
      white-space:nowrap;
      text-transform: capitalize;
    }
    .navBtn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .navBtn:active{ transform: translateY(1px); }

    .navBtnLogin{
      background: linear-gradient(135deg, rgba(23,135,171,0.95), rgba(62,183,219,0.95));
      color: rgba(5,16,26,0.92);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 16px 40px rgba(23,135,171,0.22);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 2px 0;
    }
    .brand img{
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,0.12));
    }

    .hamburger{
      display:none;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.62);
      cursor:pointer;
      font-weight: 950;
      color: rgba(11,27,43,0.82);
    }

    .drawer{
      display:none;
      border-top: 1px solid rgba(15,23,42,0.08);
      background: rgba(247,249,251,0.88);
      backdrop-filter: blur(14px);
      padding: 10px 0 14px;
    }
    .drawerInner{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ─────────────────────────────────────────────────────────────
       FULLSCREEN BEATSTARS AREA
       - uses fixed positioning so there is zero layout thrash
       - leaves space for header + ticker
    ───────────────────────────────────────────────────────────── */
    .beatstore{
      position: fixed;
      top: var(--headerH);
      left: 0;
      right: 0;
      bottom: var(--tickerH);
      background: #0b1b2b;
    }
    .beatstore iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    /* ─────────────────────────────────────────────────────────────
       TICKER (match index)
    ───────────────────────────────────────────────────────────── */
    .ticker{
      position:fixed;
      bottom:0;
      width:100%;
      height: var(--tickerH);
      background:#000;
      overflow:hidden;
      border-top:1px solid rgba(255,255,255,0.10);
      z-index: 998;
    }
    .tickerTrack{
      display:flex;
      width:max-content;
      will-change: transform;
      transform: translateX(0);
    }
    .tickerItem{
      display:flex;
      align-items:center;
      gap: 18px;
      padding: 0 22px;
      height: var(--tickerH);
      font-size:0.92rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color:#00ffff;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(0,255,255,0.18);
      animation: tickerColor 9s ease-in-out infinite alternate;
    }
    @keyframes tickerColor{
      0%{color:#00ffff}
      25%{color:#ff5c7a}
      50%{color:#a0ff00}
      75%{color:#ff00ff}
      100%{color:#00ffff}
    }

    /* ─────────────────────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────────────────────── */
    @media (max-width: 760px){
      .navGroup{ display:none; }
      .hamburger{ display:inline-flex; align-items:center; justify-content:center; }
      .topbar{ grid-template-columns: auto 1fr auto; }
      .brand{ justify-content:center; }
      .drawerInner{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header id="siteHeader">
    <div class="wrap">
      <div class="topbar">
        <div class="navGroup navLeft" aria-label="Top navigation left">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html" aria-current="page">Beats</a>
        </div>

        <div class="brand">
          <a href="/index.html" aria-label="Home">
            <img src="/assets/images/logo.jpeg?v=9" alt="beals.wav">
          </a>
        </div>

        <div class="navGroup navRight" aria-label="Top navigation right">
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn navBtnLogin" href="/login.html" id="loginTop">Login</a>
        </div>

        <button class="hamburger" id="menuBtn" aria-label="Menu" type="button">☰</button>
      </div>

      <div class="drawer" id="drawer">
        <div class="drawerInner">
          <a class="navBtn" href="/studio.html">Studio</a>
          <a class="navBtn" href="/music.html">Music</a>
          <a class="navBtn" href="/beatstore.html" aria-current="page">Beats</a>
          <a class="navBtn" href="/contact.html">Contact</a>
          <a class="navBtn" href="/faq.html">FAQ</a>
          <a class="navBtn navBtnLogin" href="/login.html" id="loginMobile">Login</a>
        </div>
      </div>
    </div>
  </header>

  <!-- BeatStars embed (fullscreen between header + ticker) -->
  <main class="beatstore" aria-label="BeatStars store">
    <iframe
      id="beatstarsFrame"
      src="https://player.beatstars.com/?storeId=150359"
      title="Beals.wav Beatstore"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; fullscreen; clipboard-write"
    ></iframe>
  </main>

  <!-- TICKER -->
  <div class="ticker" aria-label="Site ticker">
    <div class="tickerTrack" id="tickerTrack">
      <div class="tickerItem" id="tickerItem">
        Beals.wav • Beats • Leases • Exclusives • Licensing • West Jordan, Utah • © 2026 Beals.wav • Featured Release: 23.5 out now •
      </div>
    </div>
  </div>

  <script>
    // Drawer toggle (same pattern used on FAQ)
    (function () {
      const btn = document.getElementById('menuBtn');
      const drawer = document.getElementById('drawer');
      if (!btn || !drawer) return;

      btn.addEventListener('click', () => {
        const open = drawer.style.display === 'block';
        drawer.style.display = open ? 'none' : 'block';
      });

      document.addEventListener('click', (e) => {
        if (!drawer.contains(e.target) && e.target !== btn) drawer.style.display = 'none';
      });
    })();

    // Login sync (header + drawer)
    function syncLoginLinks(){
      const inL = localStorage.getItem('loggedIn') === 'true';
      const text = inL ? 'Account' : 'Login';
      const href = inL ? '/account.html' : '/login.html';

      ['loginTop','loginMobile'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.href = href;
      });
    }
    document.addEventListener('DOMContentLoaded', syncLoginLinks);

    // Header height -> CSS var (keeps embed perfectly fullscreen)
    (function(){
      const header = document.getElementById('siteHeader');
      if (!header) return;

      const set = () => {
        const h = Math.ceil(header.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--headerH', h + 'px');
      };

      // ResizeObserver avoids resize spam and handles font load changes
      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(set);
        ro.observe(header);
      }
      set();
      window.addEventListener('orientationchange', set);
    })();

    // Ticker loop (smooth, no CSS animation drift)
    (function () {
      const track = document.getElementById('tickerTrack');
      const item  = document.getElementById('tickerItem');
      if (!track || !item) return;

      const clone = item.cloneNode(true);
      track.appendChild(clone);

      let x = 0;
      const speed = 0.7;

      function step(){
        x -= speed;
        const w = item.offsetWidth;
        if (-x >= w) x = 0;
        track.style.transform = `translateX(${x}px)`;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
